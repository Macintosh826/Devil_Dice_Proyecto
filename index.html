  <script>
    // 1. Arreglo con los 16 hallazgos
    window.hallazgosAcademicos = [
      "Hallazgo Académico: La desmaterialización en los videojuegos no responde solo a la preferencia del usuario, sino a una decisión estratégica de la industria...",
      "Hallazgo Académico: El factor de decisión más determinante para la adopción masiva del formato digital entre jóvenes de 20 a 30 años es la comodidad...",
      "Hallazgo Académico: La transición a licencias digitales ha cambiado la propiedad por una licencia de uso condicionado...",
      "Hallazgo Académico: La satisfacción de uso, la disponibilidad inmediata y las funciones de juego en línea son predictores más sólidos...",
      "Hallazgo Académico: El consumidor del formato digital pierde la facultad de prestar, revender o conservar de forma autónoma sus videojuegos...",
      "Hallazgo Académico: La desaparición del soporte físico elimina elementos simbólicos de alto valor afectivo para el usuario...",
      "Hallazgo Académico: En contextos latinoamericanos como Bogotá, la transición digital enfrenta brechas particulares como el acceso limitado...",
      "Hallazgo Académico: La existencia de mercados informales de videojuegos físicos en Bogotá actúa como una alternativa...",
      "Hallazgo Académico: El mercado global de videojuegos generó $187.700 millones de dólares en 2023...",
      "Hallazgo Académico: El usuario mixto habita en una constante negociación entre el apego emocional a las ediciones físicas y la practicidad...",
      "Hallazgo Académico: La migración a catálogos digitales ha transformado el valor del videojuego...",
      "Hallazgo Académico: En la población de 20 a 30 años en Bogotá, la primera generación testigo directo de la transición completa...",
      "Hallazgo Académico: Las plataformas de distribución por suscripción (como Game Pass y PS Plus) han desplazado la compra individual...",
      "Hallazgo Académico: El gasto en contenido digital a nivel global ha llevado a las ventas físicas a representar una fracción marginal...",
      "Hallazgo Académico: Las decisiones de compra en entornos digitales están altamente condicionadas por eventos de oferta temporal...",
      "Hallazgo Académico: La desmaterialización del consumo cultural modifica la relación económica del usuario..."
    ];

    // 2. Copia para controlar datos no repetidos
    window.hallazgosDisponibles = [...window.hallazgosAcademicos];

    // 3. Función para obtener un dato aleatorio
    window.obtenerDatoAleatorio = function() {
      if (window.hallazgosDisponibles.length === 0) {
        window.hallazgosDisponibles = [...window.hallazgosAcademicos];
      }
      const index = Math.floor(Math.random() * window.hallazgosDisponibles.length);
      const datoSeleccionado = window.hallazgosDisponibles[index];
      window.hallazgosDisponibles.splice(index, 1);
      return datoSeleccionado;
    };
  </script>
